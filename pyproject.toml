[project]
name = "bpd-mcp"
version = "0.2.0"
description = "MCP server exposing Target BPD analytics over a read-only BigQuery data layer."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Biom" }]
dependencies = [
    # mcp 2.0 removed the `mcp.server.fastmcp` module this server is built on.
    # Stay on the 1.x line until we deliberately migrate.
    "mcp>=1.0.0,<2",
    # The data layer. Read-only: the service account holds dataViewer + jobUser.
    "google-cloud-bigquery>=3.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "rich>=13.7",
]
# Removed with the Kiteworks ingest half (sync/parsers/client/auth) and the local
# DuckDB warehouse:
#   duckdb        - replaced by BigQuery; the single-writer file lock it imposed is
#                   the reason for the whole migration.
#   httpx[http2]  - only the Kiteworks client and the deleted AppContext used it.
#   tenacity      - retry policy for Kiteworks downloads.
#   polars        - the CSV parse engine; nothing reads files any more.
#   pyarrow       - only used to hand polars frames to DuckDB's registrar.
#   pandas        - only the permissive parse fallback (parsers.py attempt 3).

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # The live-BigQuery test tier is ~150-250 independent round trips; -n 8 is
    # the lever for its wall time, not reduced fidelity.
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bpd-mcp = "bpd_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpd_mcp", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# E501: line too long (we keep prose long-form in docstrings)
# RUF001: ambiguous unicode in identifiers/strings (em-dashes used stylistically)
# RUF002: ambiguous unicode in docstrings (× for item×location×week is clearer than `x`)
# SIM105: try/except/pass → contextlib.suppress (the explicit form reads clearer here)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "bq: executes against live BigQuery with fixture CTE data (0 bytes billed)",
  "bq_live: executes against live BigQuery with REAL production data (bills bytes)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
